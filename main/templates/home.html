{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-3">
        <h2>Routes</h2>
        <div id="route-list" class="list-group">
            {% for route in routes %}
                <a href="#" class="list-group-item list-group-item-action" data-route-id="{{ route.id }}">
                    {{ route.name }}
                </a>
            {% endfor %}
        </div>
    </div>
    <div class="col-md-6">
        <div id="map" style="height: 80vh;"></div>
    </div>
    <div class="col-md-3">
        <h2>Details</h2>
        <div id="route-details">
            <p>Select a route to see details.</p>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<style>
    .highlight {
        background-color: #f0f0f0;
        border-left: 5px solid #007bff;
    }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let allRoutes = [];
    const routeLayers = {};
    const routeColors = ['#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe', '#008080', '#e6beff', '#9A6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#a9a9a9'];

    fetch('{% url "route_api" %}')
        .then(response => response.json())
        .then(data => {
            allRoutes = data;
            if (data.length > 0) {
                const bounds = L.latLngBounds();
                data.forEach((route, i) => {
                    const color = routeColors[i % routeColors.length];
                    const latLngs = route.points;
                    const polyline = L.polyline(latLngs, { color: color, weight: 3 }).addTo(map);
                    
                    polyline.bindTooltip(`${route.name} (${route.length.toFixed(2)} km)`, { sticky: true });

                    routeLayers[route.id] = {
                        layer: polyline,
                        originalColor: color
                    };
                    bounds.extend(polyline.getBounds());

                    polyline.on('click', () => {
                        updateDetails(route);
                        highlightListItem(route.id);
                        map.fitBounds(polyline.getBounds(), {padding: [50, 50]});
                    });

                    polyline.on('mouseover', () => {
                        polyline.setStyle({ color: 'red', weight: 5 });
                        polyline.bringToFront();
                        highlightListItem(route.id);
                    });

                    polyline.on('mouseout', () => {
                        polyline.setStyle({ color: color, weight: 3 });
                        unhighlightListItem(route.id);
                    });
                });
                if (bounds.isValid()){
                    map.fitBounds(bounds);
                }
            }
        });

    const routeListItems = document.querySelectorAll('#route-list a');
    routeListItems.forEach(item => {
        item.addEventListener('mouseover', () => {
            const routeId = item.dataset.routeId;
            const routeLayer = routeLayers[routeId];
            if (routeLayer) {
                routeLayer.layer.setStyle({ color: 'red', weight: 5 });
                routeLayer.layer.bringToFront();
            }
        });

        item.addEventListener('mouseout', () => {
            const routeId = item.dataset.routeId;
            const routeLayer = routeLayers[routeId];
            if (routeLayer) {
                routeLayer.layer.setStyle({ color: routeLayer.originalColor, weight: 3 });
            }
        });

        item.addEventListener('click', (e) => {
            e.preventDefault();
            const routeId = item.dataset.routeId;
            const route = allRoutes.find(r => r.id == routeId);
            if (route) {
                updateDetails(route);
                highlightListItem(routeId);
                const routeLayer = routeLayers[routeId];
                if (routeLayer) {
                    map.fitBounds(routeLayer.layer.getBounds(), {padding: [50, 50]});
                }
            }
        });
    });

    function updateDetails(route) {
        const detailsPanel = document.getElementById('route-details');
        detailsPanel.innerHTML = `
            <h4>${route.name}</h4>
            <p><strong>User:</strong> ${route.user__username}</p>
            <p><strong>Activity:</strong> ${route.activity_type__name}</p>
            <p><strong>Length:</strong> ${route.length.toFixed(2)} km</p>
            <div class="mt-3">
                <a href="/route/${route.id}/edit/" class="btn btn-primary btn-sm me-2">Edit</a>
                <form action="/route/${route.id}/delete/" method="post" onsubmit="return confirm('Are you sure you want to delete this route?');" style="display: inline;">
                    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </div>
        `;
    }

    function highlightListItem(routeId) {
        routeListItems.forEach(item => {
            if (item.dataset.routeId == routeId) {
                item.classList.add('highlight');
            } else {
                item.classList.remove('highlight');
            }
        });
    }

    function unhighlightListItem(routeId) {
        const item = document.querySelector(`#route-list a[data-route-id='${routeId}']`);
        if (item) {
            item.classList.remove('highlight');
        }
    }
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Route: {{ route.name }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label">Route Name</label>
            {{ form.name }}
        </div>
        <div class="mb-3">
            <label for="{{ form.activity_type.id_for_label }}" class="form-label">Activity Type</label>
            {{ form.activity_type }}
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

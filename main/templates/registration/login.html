{% extends "base.html" %}
{% load bootstrap5 %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h1 class="mb-0">Login to Track Visualizer</h1>
                </div>
                <div class="card-body">
                    <p class="card-text mb-4">Please enter your username and password to access your routes.</p>
                    <form method="post">
                        {% csrf_token %}
                        {% bootstrap_form form %}
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
